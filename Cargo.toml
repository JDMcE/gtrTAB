[workspace]
resolver = "3"
members = ["crates/*", "app/desktop"]
# The desktop shell needs the built UI, so plain `cargo build`/`cargo test` skip it.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gtr-model = { path = "crates/gtr-model" }
gtr-edit = { path = "crates/gtr-edit" }
gtr-io = { path = "crates/gtr-io" }
gtr-layout = { path = "crates/gtr-layout" }
gtr-audio = { path = "crates/gtr-audio" }
gtr-render = { path = "crates/gtr-render" }

ab_glyph_rasterizer = "0.1"
miniz_oxide = "0.8"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

num-rational = { version = "0.4", default-features = false, features = ["std", "serde"] }
proptest = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
wasm-bindgen = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
